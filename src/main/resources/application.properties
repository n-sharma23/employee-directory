spring.application.name=employee-directory

# Default profile: in-memory H2 in MySQL compatibility mode, so the app runs with no database installed.
spring.datasource.url=jdbc:h2:mem:employees;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Connection pool (HikariCP). Small on purpose: this is a demo app.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=employees-pool

spring.servlet.multipart.max-file-size=1MB
